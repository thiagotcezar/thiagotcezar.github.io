<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Tech &amp; Quality · TC Apps · Versão 1.0.0">
  <!-- Lockup de marca TC Tech & Quality. Versão: manter igual ao arquivo VERSION. -->
  <rect width="640" height="340" rx="24" fill="#0a0a0a"/>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700">
    <!-- linha 1: ícone + nome do app -->
    <g transform="translate(48 36)">
      <rect width="104" height="104" rx="24" fill="#131313" stroke="#2a2a2a" stroke-width="2"/>
      <g transform="translate(12 12) scale(2)">
        <circle cx="18" cy="18" r="13" stroke="#ff7a1a" stroke-width="2" fill="none"/>
        <circle cx="18" cy="18" r="7" stroke="#f5f5f5" stroke-width="2" fill="none"/>
        <circle cx="18" cy="18" r="2" fill="#ff7a1a"/>
        <path d="M27 27L36 36" stroke="#f5f5f5" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <text x="176" y="108" font-size="54" fill="#f5f5f5" textLength="416" lengthAdjust="spacingAndGlyphs">Tech &amp; Quality</text>
    <!-- linha 2: selo TC (cor do app) + Apps -->
    <rect x="200" y="172" width="100" height="62" rx="12" fill="#ff7a1a"/>
    <text x="250" y="219" font-size="40" fill="#0a0a0a" text-anchor="middle">TC</text>
    <text x="316" y="221" font-size="48" fill="#f5f5f5">Apps</text>
    <!-- linha 3: versão -->
    <line x1="150" y1="286" x2="222" y2="286" stroke="#6b6b6b" stroke-width="2"/>
    <text x="320" y="295" font-size="26" font-weight="500" fill="#9a9a9a" text-anchor="middle">Versão 1.0.0</text>
    <line x1="418" y1="286" x2="490" y2="286" stroke="#6b6b6b" stroke-width="2"/>
  </g>
</svg>
